[project]
name = "presenta-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/**" = ["E501"]
"tests/conftest.py" = ["E402"]
"app/services/export/layouts_html.py" = ["E501"]
"app/services/export/html.py" = ["E501"]
"app/services/export/pptx.py" = ["E501"]
"app/services/ingest/omml.py" = ["E501"]
"app/services/llm/gateway.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = ["app/db/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["deepseek: 真实 DeepSeek API 集成测试（需要真实 Key，默认跳过）"]
addopts = "-m 'not deepseek'"